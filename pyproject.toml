[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vecgrep"
version = "0.7.0"
description = "grep for meaning, not keywords. Local-first semantic search for any corpus."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "vecgrep contributors" }]
keywords = ["search", "semantic-search", "embeddings", "vector-search", "ollama", "qdrant", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Indexing",
]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.13.4",
    "qdrant-client>=1.9",
    "httpx>=0.28.1",
    "click>=8.1",
    "pypdf>=4.0",
    "beautifulsoup4>=4.12",
    "tiktoken>=0.6",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
openai = ["openai>=2.37.0"]
rerank = ["sentence-transformers>=5.6.0"]
mcp = ["mcp>=1.27.1"]
watch = ["watchfiles>=1.2.0"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[project.urls]
Homepage = "https://github.com/jeffbai996/vecgrep"
Issues = "https://github.com/jeffbai996/vecgrep/issues"

[project.scripts]
vecgrep = "vecgrep.cli.main:cli"

[tool.setuptools.packages.find]
include = ["vecgrep*"]
exclude = ["vecgrep.frontend*"]

[tool.setuptools.package-data]
vecgrep = ["frontend/dist/**/*"]
