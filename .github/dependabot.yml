version: 2
# Routine pip version-update PRs were removed: the pyproject uses `>=` floors,
# so a fresh install already pulls the newest version and floor-bumps changed
# nothing functional (just weekly churn). Actual Python CVEs still surface via
# GitHub's default security-updates, which need no config here. Only
# github-actions version updates are kept — those have no `>=` escape hatch.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(ci)
    labels:
      - dependencies
      - ci
