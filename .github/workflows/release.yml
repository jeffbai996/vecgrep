name: validation and release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Decides whether the build runs. Docs-only pull requests and pushes to main
  # skip it. This is a job and not a path filter on the push trigger:
  # GitHub applies path filters to tag pushes too, and a release tag must never
  # be skipped. It also makes a docs-only change report a skipped (passing)
  # build instead of a check that never starts. Any doubt, such as a failed API
  # call, a force-push or an oversized diff, builds.
  changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.scope.outputs.build }}
    steps:
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
        run: |
          # Pure documentation. Source, tests, scripts, workflows, pyproject and
          # lockfiles are never listed here.
          is_doc() {
            case "$1" in
              tests/*|vecgrep/*|scripts/*|typings/*) return 1 ;;
              docs/*|*.md|.github/ISSUE_TEMPLATE/*) return 0 ;;
              *) return 1 ;;
            esac
          }
          build=true
          files=""
          if [[ "$EVENT" == pull_request ]]; then
            files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
              --jq '.[] | .filename, (.previous_filename // empty)') || files=""
          elif [[ "$EVENT" == push && "$GITHUB_REF" == refs/heads/* && "$BEFORE" =~ [1-9a-f] ]]; then
            # The compare API lists at most 300 files; build when it may be cut off.
            files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" \
              --jq 'if (.files | length) >= 300 then empty else .files[] | .filename, (.previous_filename // empty) end') || files=""
          fi
          if [[ -n "$files" ]]; then
            build=false
            while IFS= read -r path; do
              is_doc "$path" || { build=true; break; }
            done <<< "$files"
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "build=$build"

  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vecgrep/frontend/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -e ".[dev,mcp,visual,code]" build
      - name: Test
        run: python -m pytest tests
      - name: Build frontend
        working-directory: vecgrep/frontend
        run: npm ci && npm run build
      - name: Build distributions
        run: python -m build
      - name: Smoke install wheel
        run: |
          python -m venv /tmp/vecgrep-smoke
          /tmp/vecgrep-smoke/bin/pip install dist/*.whl
          /tmp/vecgrep-smoke/bin/vecgrep --version
          /tmp/vecgrep-smoke/bin/vecgrep --help
          cd /tmp
          /tmp/vecgrep-smoke/bin/python -I "$GITHUB_WORKSPACE/scripts/smoke_base_install.py"
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release create "${RELEASE_TAG}" dist/* --generate-notes --verify-tag
